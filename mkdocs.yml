# ThreatForest Documentation Configuration

site_name: ThreatForest
site_description: AI-Driven Threat Modeling & Attack Tree Generation with MITRE ATT&CK Integration
site_author: ThreatForest Team
site_url: https://threatforest.dev

# Repository
repo_name: GitHub
repo_url: https://github.com/aws-samples/sample-agentic-attack-tree-generator
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 ThreatForest Team

# Theme Configuration - Using basic MkDocs theme with fully custom CSS
theme:
  name: mkdocs
  navigation_depth: 2
  nav_style: dark
  include_search_page: false
  search_index_only: false
  include_next_prev: false

# Plugins
plugins: []

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 2-6
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation Structure
nav:
  - Home: index.md
  
  - Getting Started: getting-started/index.md
  
  - User Guide:
    - Overview: user-guide/index.md
    - Preparing Your Project: user-guide/preparing-your-project.md
    - Running ThreatForest: user-guide/running-threatforest.md
    - Understanding Results: user-guide/understanding-results.md
  
  - How It Works: how-it-works.md
  
  - Architecture: architecture/overview.md
  
  - FAQ: faq.md

# Extra Configuration
extra:
  version:
    provider: mike
    default: latest
  
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aws-samples/sample-agentic-attack-tree-generator
      name: ThreatForest on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/threatforest/
      name: ThreatForest on PyPI
  
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Replace with your Google Analytics ID
  
  generator: false  # Hide "Made with Material for MkDocs" footer

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://d3js.org/d3.v7.min.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

# Watch for changes
watch:
  - src/threatforest
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
