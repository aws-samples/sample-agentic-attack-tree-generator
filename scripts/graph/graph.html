        var edges = new vis.DataSet([{"from": "attack-pattern--67cb8307-acdb-4111-b9a8-920b1affd001", "to": "attack-pattern--840bab84-6944-4746-a785-62b1cda64740", "tooltip_html": "\n<div style='font-family: Arial, sans-serif; max-width: 350px; padding: 10px; background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);'>\n    <div style='background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; font-size: 12px;'>\n        SUBTECHNIQUE_OF\n    </div>\n    <div style='font-size: 11px; color: #7f8c8d; margin-bottom: 4px;'>\n        <span style='font-weight: 600;'>From:</span> <span style='color: #2c3e50;'>attack-pattern--67cb8307-acdb-4111-b9a8-920b1affd001</span>\n    </div>\n    <div style='font-size: 11px; color: #7f8c8d;'>\n        <span style='font-weight: 600;'>To:</span> <span style='color: #2c3e50;'>attack-pattern--840bab84-6944-4746-a785-62b1cda64740</span>\n    </div>\n\n    <div style='border-top: 1px solid #ecf0f1; margin-top: 8px; padding-top: 8px;'>\n        <div style='font-weight: 600; color: #2c3e50; margin-bottom: 6px; font-size: 11px;'>Properties:</div>\n\n        <div style='margin-left: 10px; margin-bottom: 4px; font-size: 10px;'>\n            <span style='color: #7f8c8d;'>created:</span> <span style='color: #2c3e50;'>2020-11-30T20:27:23.599491Z</span>\n        </div>\n\n        <div style='margin-left: 10px; margin-bottom: 4px; font-size: 10px;'>\n            <span style='color: #7f8c8d;'>modified:</span> <span style='color: #2c3e50;'>2025-01-29T21:26:09.007429Z</span>\n        </div>\n\n        <div style='margin-left: 10px; margin-bottom: 4px; font-size: 10px;'>\n            <span style='color: #7f8c8d;'>relationship_id:</span> <span style='color: #2c3e50;'>relationship--788e0d6b-0964-43e0-a893-fe5176edcfab</span>\n        </div>\n\n    </div>\n\n</div>\n", "arrows": "to", "color": {"color": "#848484", "highlight": "#667eea"}}, {"fr         var container = document.getElementById('mynetwork');
        var data = {
            nodes: nodes,
            edges: edges
        };
        
        var options = {
            physics: {
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.3,
                    springLength: 95,
                    springConstant: 0.04,
                    damping: 0.09
                },
                stabilization: {
                    iterations: 100
                }
            },
            interaction: {
                hover: true,
                navigationButtons: true,
                keyboard: true,
                tooltipDelay: 0
            },
            edges: {
                smooth: {
                    type: 'continuous'
                }
            },
            nodes: {
                chosen: {
                    node: function(values, id, selected, hovering) {
                        if (hovering) {
                            values.borderWidth = 3;
                        }
                    }
                }
            }
        };
        
        var network = new vis.Network(container, data, options);
        
        // Custom tooltip handling with proper positioning
        var tooltip = document.getElementById('tooltip');
        
        network.on('hoverNode', function(params) {
            var nodeId = params.node;
            var node = nodes.get(nodeId);
            if (node && node.tooltip_html) {
                tooltip.innerHTML = node.tooltip_html;
                tooltip.style.display = 'block';
                
                // Get proper positioning using page coordinates
                var rect = container.getBoundingClientRect();
                tooltip.style.left = (rect.left + params.pointer.DOM.x + 15) + 'px';
                tooltip.style.top = (rect.top + params.pointer.DOM.y + 15) + 'px';
            }
        });
        
        network.on('blurNode', function() {
            tooltip.style.display = 'none';
        });
        
        network.on('hoverEdge', function(params) {
            var edgeId = params.edge;
            var edge = edges.get(edgeId);
            if (edge && edge.tooltip_html) {
                tooltip.innerHTML = edge.tooltip_html;
                tooltip.style.display = 'block';
                
                // Get proper positioning using page coordinates
                var rect = container.getBoundingClientRect();
                tooltip.style.left = (rect.left + params.pointer.DOM.x + 15) + 'px';
                tooltip.style.top = (rect.top + params.pointer.DOM.y + 15) + 'px';
            }
        });
        
        network.on('blurEdge', function() {
            tooltip.style.display = 'none';
        });
        
        // Side panel handling
        var sidePanel = document.getElementById('side-panel');
        var sidePanelContent = document.getElementById('side-panel-content');
        var selectedNodeId = null;
        
        function closeSidePanel() {
            sidePanel.classList.remove('visible');
            if (selectedNodeId) {
                network.unselectAll();
                selectedNodeId = null;
            }
        }
        
        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                selectedNodeId = nodeId;
                var node = nodes.get(nodeId);
                
                if (node) {
                    // Get node details from NetworkX data
                    var nodeData = data.nodes.get(nodeId);
                    
                    // Extract properties (those with prop_ prefix)
                    var properties = Object.keys(nodeData).filter(k => k.startsWith('prop_'));
                    
                    // Count connections
                    var outgoing = edges.get({
                        filter: function(edge) { return edge.from === nodeId; }
                    }).length;
                    var incoming = edges.get({
                        filter: function(edge) { return edge.to === nodeId; }
                    }).length;
                    
                    // Build detailed panel HTML
                    var panelHTML = `
                        <div style="margin-bottom: 20px;">
                            <div style="background: ${nodeData.color}; color: white; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; margin-bottom: 15px;">
                                Node Details
                            </div>
                            
                            <div style="background: #ecf0f1; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #7f8c8d; font-size: 11px; margin-bottom: 5px;">TYPE</div>
                                <div style="font-size: 14px; color: #2c3e50;">${nodeData.label}</div>
                            </div>
                            
                            <div style="background: #ecf0f1; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #7f8c8d; font-size: 11px; margin-bottom: 5px;">ID</div>
                                <div style="font-family: 'Courier New', monospace; font-size: 12px; color: #2c3e50; word-wrap: break-word; overflow-wrap: break-word;">${nodeId}</div>
                            </div>
                            
                            <div style="background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #388e3c; font-size: 11px; margin-bottom: 8px;">CONNECTIONS</div>
                                <div style="display: flex; justify-content: space-around;">
                                    <div style="text-align: center;">
                                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;">${outgoing}</div>
                                        <div style="font-size: 10px; color: #7f8c8d;">Outgoing</div>
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;">${incoming}</div>
                                        <div style="font-size: 10px; color: #7f8c8d;">Incoming</div>
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;">${outgoing + incoming}</div>
                                        <div style="font-size: 10px; color: #7f8c8d;">Total</div>
                                    </div>
                                </div>
                            </div>
                    `;
                    
                    // Add properties section if properties exist
                    if (properties.length > 0) {
                        panelHTML += `
                            <div style="border-top: 2px solid #bdc3c7; padding-top: 15px;">
                                <div style="font-weight: 600; color: #2c3e50; font-size: 13px; margin-bottom: 12px;">PROPERTIES</div>
                        `;
                        
                        properties.forEach(function(key) {
                            var value = nodeData[key];
                            var valueStr = String(value);
                            // Escape HTML
                            valueStr = valueStr.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            
                            // Remove prop_ prefix for display
                            var displayKey = key.replace('prop_', '');
                            
                            panelHTML += `
                                <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #ecf0f1;">
                                    <div style="font-weight: 600; color: #7f8c8d; font-size: 10px; text-transform: uppercase; margin-bottom: 4px;">${displayKey}</div>
                                    <div style="color: #2c3e50; font-size: 12px; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap;">${valueStr}</div>
                                </div>
                            `;
                        });
                        
                        panelHTML += `</div>`;
                    }
                    
                    panelHTML += `</div>`;
                    
                    // Update side panel
                    sidePanelContent.innerHTML = panelHTML;
                    sidePanel.classList.add('visible');
                    
                    // Highlight selected node
                    network.selectNodes([nodeId]);
                }
            } else {
                // Clicked on empty space
                closeSidePanel();
            }
        });
        
        // Log graph statistics
        console.log('Graph loaded: ' + nodes.length + ' nodes, ' + edges.length + ' edges');
    </script>
