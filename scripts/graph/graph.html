 style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>created:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>2024-10-11T01:59:10.578431Z</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>description:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Adversaries may attempt to modify hierarchical structures in infrastructure-as-a-service (IaaS) environments in order to evade defenses.\n\nIaaS environ...</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>stix_type:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>attack-pattern</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>modified:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>2025-01-29T21:26:09.261165Z</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>urls:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>https://attack.mitre.org/techniques/T1666,https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1666</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>tactics:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>defense-evasion</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>name:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Modify Cloud Resource Hierarchy</span>\n            </div>\n\n        </div>\n    </div>\n\n</div>\n", "color": "#95e1d3", "size": 20, "node_type": "Technique", "prop_stix_id": "attack-pattern--b963d615-5442-47ff-8645-56071b5070d1", "prop_created": "2024-10-11T01:59:10.578431Z", "prop_description": "Adversaries may attempt to modify hierarchical structures in infrastructure-as-a-service (IaaS) environments in order to evade defenses.\n\nIaaS environments often group resources into a hierarchy, enabling improved resource management and application of policies to relevant groups. Hierarchical structures differ among cloud providers. For example, in AWS environments, multiple accounts can be grouped under a single organization, while in Azure environments, multiple subscriptions can be grouped under a single management group.\n\nAdversaries may add, delete, or otherwise modify resource groups within an IaaS hierarchy. For example, in Azure environments, an adversary who has gained access to a Global Administrator account may create new subscriptions in which to deploy resources. They may also engage in subscription hijacking by transferring an existing pay-as-you-go subscription from a victim tenant to an adversary-controlled tenant. This will allow the adversary to use the victim\u2019s compute resources without generating logs on the victim tenant.\n\nIn AWS environments, adversaries with appropriate permissions in a given account may call the LeaveOrganization API, causing the account to be severed from the AWS Organization to which it was tied and removing any Service Control Policies, guardrails, or restrictions imposed upon it by its former Organization. Alternatively, adversaries may call the CreateAccount API in order to create a new account within an AWS Organization. This account will use the same payment methods registered to the payment account, but will not be subject to existing detections or Service Control Policies.", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.261165Z", "prop_urls": "https://attack.mitre.org/techniques/T1666,https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1666", "prop_tactics": "defense-evasion", "prop_name": "Modify Cloud Resource Hierarchy", "prop_external_ids": "T1666,T1666", "prop_aliases": "T1666"}, {"id": "attack-pattern--b26a9b54-cd02-44f3-807f-708fbfa56998", "label": "attack-pattern--b26a9b54-cd...", "tooltip_html": "\n<div style='font-family: Arial, sans-serif; max-width: 400px; padding: 12px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);'>\n    <div style='background: #95e1d3; color: white; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; font-size: 14px;'>\n        Technique\n    </div>\n    <div style='font-family: \"Courier New\", monospace; color: #34495e; margin-bottom: 12px; padding: 8px; background: #ecf0f1; border-radius: 4px; font-size: 12px; word-break: break-all;'>\n        attack-pattern--b26a9b54-cd02-44f3-807f-708fbfa56998\n    </div>\n\n    <div style='border-top: 2px solid #bdc3c7; padding-top: 10px;'>\n        <div style='font-weight: bold; color: #2c3e50; margin-bottom: 8px; font-size: 13px;'>Properties:</div>\n        <div style='padding-left: 10px;'>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>stix_id:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>attack-pattern--b26a9b54-cd02-44f3-807f-708fbfa56998</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>created:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>2024-10-09T04:06:53.247939Z</span>\n 30, "node_type": "Technique", "prop_stix_id": "attack-pattern--b26a9b54-cd02-44f3-807f-708fbfa56998", "prop_created": "2024-10-09T04:06:53.247939Z", "prop_description": "Adversaries may leverage compromised software-as-a-service (SaaS) applications to complete resource-intensive tasks, which may impact hosted service availability.\n\nForeaxmple, adversaries may leverage email and messaging services, such as AWS Simple Email Service (SES), AWS Simple Notification Service (SNS), and Twilio, in order to send large quantities of spam / Pushing email and SMS messages.  Alternatively, they may engage in LLMJacking by leveraging reverse proxies to hijack the power o fcloud-hosted AI models.\n\nIn some cases, adversaries may leverage services that the victim is already using.  In others, particularly when the service is part of a larger cloud platform, they may first enable the service. Leveraging SaaS applciatios may cause the victim to incur significant financial costs, use up service quotas, and otherwise impact availability.", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.274166Z", "prop_urls": "https://attack.mitre.org/techniques/T1496/004,https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1496/004", "prop_tactics": "impact", "prop_name": "Cloud Service Hijacking", "prop_external_ids": "T1496.004,T1496.004", "prop_aliases": "T1496.004"}, {"id": "attack-pattern--9d9ad4ce-8356-4f0f-a71c-0763af56ecdd", "label": "attack-pattern--9d9ad4ce-83...", "tooltip_html": "\n<div style='font-family: Arial, sans-serif; max-width: 400px; padding: 12px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);'>\n    <div style='background: #95e1d3; color: white; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; font-size: 14px;'>\n        Technique\n    </div>\n    <div style='font-family: \"Courier New\", monospace; color: #34495e; margin-bottom: 12px; padding: 8px; backgrou   <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>urls:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>https://attack.mitre.org/techniques/T1485,https://www.symantec.com/connect/blogs/shamoon-attacks,https://www.fireeye.com/blog/threat-research/2016/11/...</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>tactics:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>impact</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>aws_services:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Amazon S3,Amazon Simple Storage Service (S3),AWS Backup,AWS Storage Gateway,Amazon FSx for Lustre,Amazon Relational Database Service (RDS),Amazon FSx ...</span>\n            </div>\n\n        </div>\n    </div>\n\n</div>\n", "color": "#95e1d3", "size": 20, "node_type": "Technique", "prop_stix_id": "attack-pattern--9d9ad4ce-8356-4f0f-a71c-0763af56ecdd", "prop_created": "2019-03-14T18:47:17.701Z", "prop_description": "Adversaries may destroy data and files on specific systems or in large numbers on a network to interrupt availability to systems, services, and network resources. Data destruction is likely to render stored data irrecoverable by forensic techniques through overwriting files or data on local and remote drives.(Citation: Symantec Shamoon 2012)(Citation: FireEye Shamoon Nov 2016)(Citation: Palo Alto Shamoon Nov 2016)(Citation: Kaspersky StoneDrill 2017)(Citation: Unit 42 Shamoon3 2018)(Citation: Talos Olympic Destroyer 2018) Common operating system file deletion commands such as <code>del</code> and <code>rm</code> often only remove pointers to files without wiping the contents of the files themselves, making the files recoverable by proper forensic methodology. This behavior is distinct from [Disk Content Wipe](https://attack.mitre.org/techniques/T1561/001) and [Disk Structure Wipe](https://attack.mitre.org/techniques/T1561/002) because individual files are destroyed rather than sections of a storage disk or the disk's logical structure.\n\nAdversaries may attempt to overwrite files and directories with randomly generated data to make it irrecoverable.(Citation: Kaspersky StoneDrill 2017)(Citation: Unit 42 Shamoon3 2018) In some cases politically oriented image files have been used to overwrite data.(Citation: FireEye Shamoon Nov 2016)(Citation: Palo Alto Shamoon Nov 2016)(Citation: Kaspersky StoneDrill 2017)\n\nTo maximize impact on the target organization in operations where network-wide availability interruption is the goal, malware designed for destroying data may have worm-like features to propagate across a network by leveraging additional techniques like [Valid Accounts](https://attack.mitre.org/techniques/T1078), [OS Credential Dumping](https://attack.mitre.org/techniques/T1003), and [SMB/Windows Admin Shares](https://attack.mitre.org/techniques/T1021/002).(Citation: Symantec Shamoon 2012)(Citation: FireEye Shamoon Nov 2016)(Citation: Palo Alto Shamoon Nov 2016)(Citation: Kaspersky StoneDrill 2017)(Citation: Talos Olympic Destroyer 2018).\n\nIn cloud environments, adversaries may leverage access to delete cloud storage, cloud storage accounts, machine images, database instances, and other infrastructure crucial to operations to damage an organization or their customers. (Citation: Data Destruction - Threat Post)(Citation: DOJ  - Cisco Insider)", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.24427Z", "prop_urls": "https://attack.mitre.org/techniques/T1485,https://www.symantec.com/connect/blogs/shamoon-attacks,https://www.fireeye.com/blog/threat-research/2016/11/fireeye_respondsto.html,http://researchcenter.paloaltonetworks.com/2016/11/unit42-shamoon-2-return- n style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Amazon CloudWatch,Amazon Elastic Compute Cloud (EC2),Amazon Elastic Container Registry (ECR),Amazon Simple Notification Service (SNS),Amazon Relationa...</span>\n            </div>\n\n        </div>\n    </div>\n\n</div>\n", "color": "#95e1d3", "size": 20, "node_type": "Technique", "prop_stix_id": "attack-pattern--0460b866-6a37-48ef-8350-f81242a8e15a", "prop_created": "2018-04-18T17:59:24.739Z", "prop_description": "Adversaries may attempt to take advantage of a weakness in an Internet-facing computer or program using software, data, or commands in order to cause unintended or unanticipated behavior. The weakness in the system can be a bug, a glitch, or a design vulnerability. These applications are often websites, but can include databases (like SQL)(Citation: NVD CVE-2016-6662), standard services (like SMB(Citation: CIS Multiple SMB Vulnerabilities) or SSH), network device administration and management protocols (like SNMP and Smart Install(Citation: US-CERT TA18-106A Network Infrastructure Devices 2018)(Citation: Cisco Blog Legacy Device Attacks)), and any other applications with Internet accessible open sockets, such as web servers and related services.(Citation: NVD CVE-2014-7169) Depending on the flaw being exploited this may include [Exploitation for Defense Evasion](https://attack.mitre.org/techniques/T1211). \n\nIf an application is hosted on cloud-based infrastructure and/or is containerized, then exploiting it may lead to compromise of the underlying instance or container.  This can allow an adversary a path to access the cloud or container APIs (e.g., via the Cloud Instance Metadata API), exploit container host access via Escape to Host, or take advantage of weak identity and access management policies\n\nFor websites and databases, the OWASP top 10 and CWE top 25 highlight the most common web-based vulnerabilities.(Citation: OWASP Top 10)(Citation: CWE top 25)", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.254252Z", "prop_urls": "https://attack.mitre.org/techniques/T1190,https://cwe.mitre.org/top25/index.html,https://www.cisecurity.org/advisory/multiple-vulnerabilities-in-microsoft-windows-smb-server-could-allow-for-remote-code-execution/,https://www.wired.com/story/russia-ukraine-cyberattacks-mandiant/,https://www.mandiant.com/resources/blog/fortinet-malware-ecosystem,https://nvd.nist.gov/vuln/detail/CVE-2016-6662,https://nvd.nist.gov/vuln/detail/CVE-2014-7169,https://community.cisco.com/t5/security-blogs/attackers-continue-to-target-legacy-devices/ba-p/4169954,https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project,https://us-cert.cisa.gov/ncas/alerts/TA18-106A,https://cwe.mitre.org/top25/index.html,https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1190", "prop_tactics": "initial-access", "prop_aws_services": "Amazon CloudWatch,Amazon Elastic Compute Cloud (EC2),Amazon Elastic Container Registry (ECR),Amazon Simple Notification Service (SNS),Amazon Relational Database Service (RDS),Amazon Simple Storage Service (S3),Amazon Elastic Kubernetes Services (EKS),Amazon Lightsail,AWS Outposts,Amazon Elastic MapReduce (EMR),Amazon CloudSearch,AWS Elastic Beanstalk,Amazon Elasticsearch Service,Amazon Redshift,Amazon Simple Queue Service (SQS),Amazon API Gateway,AWS Fargate,AWS Lambda,Amazon Virtual Private Cloud (VPC)", "prop_name": "Exploit Public-Facing Application", "prop_external_ids": "T1190,T1190", "prop_aliases": "T1190"}, {"id": "attack-pattern--248b1050-3172-4476-b7a8-5be4457eab5d", "label": "attack-pattern--248b1050-31...", "tooltip_html": "\n<div style='font-family: Arial, sans-serif; max-width: 400px; padding: 12px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);'>\n    <div style='background: #95e1d3; color: white; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; font-size: 14px;'>\n        Technique\n    </div>\n    < ottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>tactics:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>execution,persistence</span>\n            </div>\n\n        </div>\n    </div>\n\n</div>\n", "color": "#95e1d3", "size": 60, "node_type": "Technique", "prop_stix_id": "attack-pattern--97a39f55-e67a-4839-bf3c-a01254d66c8c", "prop_aws_api_events": "lambda:Invoke", "prop_created": "2020-11-30T20:27:23.701353Z", "prop_description": "AWS Lambda is a compute service that provides a way to run code without provisioning or managing servers. You can invoke Lambda functions directly with the Lambda console, the Lambda API, the AWS SDK, the AWS CLI, and AWS toolkits. You can also configure other AWS services to invoke a Lambda function, or Lambda can be configured to read from a stream or queue and invoke a function.\n\nAdversaries may use Lambda to run code in response to events, such as changes to data in an Amazon S3 bucket or an Amazon DynamoDB table; to run code in response to HTTP requests using Amazon API Gateway; or invoke code using API calls made using AWS SDKs.", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.302638Z", "prop_urls": "https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1648/A001,https://docs.aws.amazon.com/lambda/latest/dg/welcome.html,https://docs.aws.amazon.com/lambda/latest/dg/lambda-invocation.html,https://awscli.amazonaws.com/v2/documentation/api/latest/reference/lambda/invoke.html,https://awscli.amazonaws.com/v2/documentation/api/latest/reference/lambda/update-function-code.html,https://awscli.amazonaws.com/v2/documentation/api/latest/reference/lambda/create-function.html", "prop_tactics": "execution,persistence", "prop_aws_services": "AWS Lambda", "prop_name": "Invoking Lambda Function", "prop_external_ids": "T1648.A001", "prop_aliases": "T1648.A001,AT1001"}, {"id": "attack-pattern--1fdbf8e e='color: #7f8c8d; font-weight: 600; font-size: 11px;'>stix_type:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>attack-pattern</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>modified:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>2025-01-29T21:26:09.102882Z</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>urls:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>https://attack.mitre.org/techniques/T1496,https://securelist.com/lazarus-under-the-hood/77908/,https://blog.cloudsploit.com/the-danger-of-unused-aws-r...</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>tactics:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>impact</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>aws_services:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Amazon Simple Notification Service (SNS),Amazon Elastic Compute Cloud (EC2),Amazon EC2,Amazon Cognito,Amazon Simple Email Service (SES)</span>\n            </div>\n\n        </div>\n    </div>\n\n</div>\n", "color": "#95e1d3", "size": 30, "node_type": "Technique", "prop_stix_id": "attack-pattern--1fdbf8e5-c256-4c2b-b422-4775649648f1", "prop_created": "2019-04-17T14:50:05.682Z", "prop_description": "Adversaries may leverage the resources of co-opted systems in order to solve resource intensive problems which may impact system and/or hosted service availability. \n\nOne common purpose for Resource Hijacking is to validate transactions of cryptocurrency networks and earn virtual currency. Adversaries may consume enough system resources to negatively impact and/or cause affected machines to become unresponsive.(Citation: Kaspersky Lazarus Under The Hood Blog 2017) Servers and cloud-based(Citation: CloudSploit - Unused AWS Regions) systems are common targets because of the high potential for available resources, but user endpoint systems may also be compromised and used for Resource Hijacking and cryptocurrency mining. Containerized environments may also be targeted due to the ease of deployment via exposed APIs and the potential for scaling mining activities by deploying or compromising multiple containers within an environment or cluster.(Citation: Unit 42 Hildegard Malware)(Citation: Trend Micro Exposed Docker APIs)\n\nAdditionally, some cryptocurrency mining malware kills off processes for competing malware to ensure it\u2019s not competing for resources.(Citation: Trend Micro War of Crypto Miners)", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.102882Z", "prop_urls": "https://attack.mitre.org/techniques/T1496,https://securelist.com/lazarus-under-the-hood/77908/,https://blog.cloudsploit.com/the-danger-of-unused-aws-regions-af0bf1b878fc,https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/,https://www.trendmicro.com/en_us/research/19/e/infected-cryptocurrency-mining-containers-target-docker-hosts-with-exposed-apis-use-shodan-to-find-additional-victims.html,https://www.trendmicro.com/en_us/research/20/i/war-of-linux-cryptocurrency-miners-a-battle-for-resources.html,https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1496", "prop_tactics": "impact", "prop_aws_services": "Amazon Simple Notification Service (SNS),Amazon Elastic Compute Cloud (EC2),Amazon EC2,Amazon Cognito,Amazon Simple Email Service (SES)", "prop_name": "Resource Hijacking", "prop_external_ids": "T1496,T1496", "prop_aliases": "T1496"}, {"id": "attack-pattern--a92553bb-4a6b-44de-ab5c-4b2f445a7185", "label": "attack-pattern--a92553bb-4a...", "tooltip_html": "\n<div style='font-family: Arial, sans-serif; max-width: 400px; padding: 12px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);'>\n    <div style='background: #95e1d3; color: white; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; font-size: 14px;'>\n        Technique\n    </div>\n    <div style='font-family: \"Courier New\", monospace; color: #34495e; margin-bottom: 12px; padding: 8px; background: #ecf0f1; border-radius: 4px; font-size: 12px; word-break: break-all;'>\n        attack-pattern--a92553bb-4a6b-44de-ab5c-4b2f445a7185\n    </div>\n\n    <div style='border-top: 2px solid #bdc3c7; padding-top: 10px;'>\n        <div style='font-weight: bold; color: #2c3e50; margin-bottom: 8px; font-size: 13px;'>Properties:</div>\n        <div style='padding-left: 10px;'>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>stix_id:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>attack-pattern--a92553bb-4a6b-44de-ab5c-4b2f445a7185</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>created:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>2024-09-13T06:16:40.892758Z</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>description:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Adversaries may leverage information repositories to mine valuable information. Information repositories are tools that allow for storage of informati...</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>stix_type:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>attack-pattern</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>modified:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>2025-01-29T21:26:09.248569Z</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>urls:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>https://attack.mitre.org/techniques/T1213,https://confluence.atlassian.com/confkb/how-to-enable-user-access-logging-182943.html,https://support.office...</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>tactics:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>collection</span>\n            </div>\n\n            <div style='margin-bottom: 6px;'>\n                <span style='color: #7f8c8d; font-weight: 600; font-size: 11px;'>name:</span>\n                <span style='color: #2c3e50; margin-left: 6px; font-size: 11px;'>Data from Information Repositories</span>\n            </div>\n\n        </div>\n    </div>\n\n</div>\n", "color": "#95e1d3", "size": 20, "node_type": "Technique", "prop_stix_id": "attack-pattern--a92553bb-4a6b-44de-ab5c-4b2f445a7185", "prop_created": "2024-09-13T06:16:40.892758Z", "prop_description": "Adversaries may leverage information repositories to mine valuable information. Information repositories are tools that allow for storage of information, typically to facilitate collaboration or information sharing between users, and can store a wide variety of data that may aid adversaries in further objectives, or direct access to the target information. Adversaries may also abuse external sharing features to share sensitive documents with recipients outside of the organization. \n\nThe following is a brief list of example information that may hold potential value to an adversary and may also be found on an information repository:\n\n* Policies, procedures, and standards\n* Physical / logical network diagrams\n* System architecture diagrams\n* Technical system documentation\n* Testing / development credentials\n* Work / project schedules\n* Source code snippets\n* Links to network shares and other internal resources\n\nInformation stored in a repository may vary based on the specific instance or environment. Specific common information repositories include web-based platforms such as [Sharepoint](https://attack.mitre.org/techniques/T1213/002) and [Confluence](https://attack.mitre.org/techniques/T1213/001), specific services such as Code Repositories, IaaS databases, enterprise databases, and other storage infrastructure such as SQL Server.\n\nIn some cases, information repositories have been improperly secured, typically by unintentionally allowing for overly-broad access by all users or even public access to authenticated users.  This is particularly common with cloud-native or cloud-hosted services, such as AWS Relational Database Service (RDS), Redis, or ElasticSearch.", "prop_stix_type": "attack-pattern", "prop_modified": "2025-01-29T21:26:09.248569Z", "prop_urls": "https://attack.mitre.org/techniques/T1213,https://confluence.atlassian.com/confkb/how-to-enable-user-access-logging-182943.html,https://support.office.com/en-us/article/configure-audit-settings-for-a-site-collection-a9920c97-38c0-44f2-8bcb-4cf1e2ae22d2,https://docs.microsoft.com/en-us/microsoft-365/compliance/use-sharing-auditing?view=o365-worldwide#sharepoint-sharing-events,https://w.amazon.com/bin/view/AWS/Teams/GlobalServicesSecurity/TDIR/TRIAD/AAF/Techniques/T1213"         });
        
        // Side panel handling
        var sidePanel = document.getElementById('side-panel');
        var sidePanelContent = document.getElementById('side-panel-content');
        var selectedNodeId = null;
        
        function closeSidePanel() {
            sidePanel.classList.remove('visible');
            if (selectedNodeId) {
                network.unselectAll();
                selectedNodeId = null;
            }
        }
        
        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                selectedNodeId = nodeId;
                var node = nodes.get(nodeId);
                
                if (node) {
                    // Get node details from NetworkX data
                    var nodeData = data.nodes.get(nodeId);
                    
                    // Extract properties (those with prop_ prefix)
                    var properties = Object.keys(nodeData).filter(k => k.startsWith('prop_'));
                    
                    // Count connections
                    var outgoing = edges.get({
                        filter: function(edge) { return edge.from === nodeId; }
                    }).length;
                    var incoming = edges.get({
                        filter: function(edge) { return edge.to === nodeId; }
                    }).length;
                    
                    // Build detailed panel HTML
                    var panelHTML = `
                        <div style="margin-bottom: 20px;">
                            <div style="background: ${nodeData.color}; color: white; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; margin-bottom: 15px;">
                                Node Details
                            </div>
                            
                            <div style="background: #ecf0f1; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #7f8c8d; font-size: 11px; margin-bottom: 5px;">TYPE</div>
                                <div style="font-size: 14px; color: #2c3e50;">${nodeData.label}</div>
                            </div>
                            
                            <div style="background: #ecf0f1; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #7f8c8d; font-size: 11px; margin-bottom: 5px;">ID</div>
                                <div style="font-family: 'Courier New', monospace; font-size: 12px; color: #2c3e50; word-wrap: break-word; overflow-wrap: break-word;">${nodeId}</div>
                            </div>
                            
                            <div style="background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                                <div style="font-weight: 600; color: #388e3c; font-size: 11px; margin-bottom: 8px;">CONNECTIONS</div>
                                <div style="display: flex; justify-content: space-around;">
                                    <div style="text-align: center;">
                                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;">${outgoing}</div>
                                        <div style="font-size: 10px; color: #7f8c8d;">Outgoing</div>
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;">${incoming}</div>
                                        <div style="font-size: 10px; color: #7f8c8d;">Incoming</div>
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-size: 24px; font-weight: bold; color: #388e3c;">${outgoing + incoming}</div>
                                        <div style="font-size: 10px; color: #7f8c8d;">Total</div>
                                    </div>
                                </div>
                            </div>
                    `;
                    
                    // Add properties section if properties exist
                    if (properties.length > 0) {
                        panelHTML += `
                            <div style="border-top: 2px solid #bdc3c7; padding-top: 15px;">
                                <div style="font-weight: 600; color: #2c3e50; font-size: 13px; margin-bottom: 12px;">PROPERTIES</div>
                        `;
                        
                        properties.forEach(function(key) {
                            var value = nodeData[key];
                            var valueStr = String(value);
                            // Escape HTML
                            valueStr = valueStr.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            
                            // Remove prop_ prefix for display
                            var displayKey = key.replace('prop_', '');
                            
                            panelHTML += `
                                <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #ecf0f1;">
                                    <div style="font-weight: 600; color: #7f8c8d; font-size: 10px; text-transform: uppercase; margin-bottom: 4px;">${displayKey}</div>
                                    <div style="color: #2c3e50; font-size: 12px; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap;">${valueStr}</div>
                                </div>
                            `;
                        });
                        
                        panelHTML += `</div>`;
                    }
                    
                    panelHTML += `</div>`;
                    
                    // Update side panel
                    sidePanelContent.innerHTML = panelHTML;
                    sidePanel.classList.add('visible');
                    
                    // Highlight selected node
                    network.selectNodes([nodeId]);
                }
            } else {
                // Clicked on empty space
                closeSidePanel();
            }
        });
        
        // Log graph statistics
        console.log('Graph loaded: ' + nodes.length + ' nodes, ' + edges.length + ' edges');
    </script>
</body>
</html>
