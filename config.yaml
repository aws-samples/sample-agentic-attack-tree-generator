# Embeddings settings
embeddings:
  model: "cisco-ai/SecureBERT2.0-biencoder"
  graph_file: "data/graphs/mitre_attack_graph.json"
  ttc_threshold: 0.3  # Similarity threshold for TTC matching (0-1, lowered from 0.8 for better local graph matching)