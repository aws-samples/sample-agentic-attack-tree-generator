# ThreatForest Configuration


# Data paths
data:
  # STIX bundle file containing MITRE ATT&CK data
  stix_bundle: "data/threat-intelligence/enterprise-attack-18.0.json"
  
  # Embeddings file
  embeddings_file: "data/embeddings/attack_pattern_embeddings_qwen.json"
  
  # Input directory for processing (empty means user must specify)
  input_dir: ""
  
  # Output directory for generated files
  output_dir: ""

# Model settings
models:
  default_bedrock_model: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Examples:
  # - "us.anthropic.claude-sonnet-4-20250514-v1:0"      # Claude Sonnet 4
  # - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"    # Claude Sonnet 4.5
  # - "us.anthropic.claude-opus-4-1-20250805-v1:0"      # Claude Opus 4.1

# Embeddings settings
embeddings:
  mode: "neptune"  # Options: "local" or "neptune"
  model: "cisco-ai/SecureBERT2.0-biencoder"
  
# Neptune settings (required when embeddings.mode=neptune)
neptune:
  graph_id: "g-csewvv20d7"
  region: "us-east-1"
  s3_bucket: "threatforest-neptune"
  account_id: "092797877696"
  
# AWS settings
aws:
  default_profile: "threatforest"
  default_region: "us-east-1"
