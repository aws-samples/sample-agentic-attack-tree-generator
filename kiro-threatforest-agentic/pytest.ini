[tool:pytest]
# Pytest configuration for ThreatForest

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests (may be slow)
    performance: Performance tests (may be slow)  
    security: Security tests
    slow: Slow running tests (>30 seconds)
    unit: Unit tests (fast)

# Output options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings
    -ra

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# addopts = -n auto  # Uncomment to enable parallel execution

# Coverage options (when --cov is used)
# addopts = --cov=threatforest --cov-report=html --cov-report=term-missing

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:boto3.*
    ignore::UserWarning:botocore.*

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test collection
collect_ignore = 
    setup.py
    build/
    dist/
    .tox/
    .eggs/
    *.egg-info/
    .pytest_cache/
    __pycache__/

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL

# Cache
cache_dir = .pytest_cache