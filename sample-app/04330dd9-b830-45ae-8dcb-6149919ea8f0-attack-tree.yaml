title: Attack Tree for System Prompt Leakage

facts:
- external_threat_actor_with_llm_access: External threat actor who can interact with the LLM API
  from:
  - reality: Initial condition

attacks:
- api_access_establishment: Establish access to LLM API using AT1667.001 API Gateway
  from:
  - external_threat_actor_with_llm_access
- prompt_crafting: Craft carefully designed queries to extract system prompts using T1059.009 Cloud API
  from:
  - api_access_establishment
- system_prompt_extraction: Extract system prompt instructions and internal operation details
  from:
  - prompt_crafting

goals:
- security_configuration_exposure: Extract system prompt instructions reducing confidentiality of system security configuration and implementation
  from:
  - system_prompt_extraction

filter:
- security_configuration_exposure
