[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatforest"
version = "0.4.2"
description = "AI-Driven Threat Modeling & Attack Tree Generation with MITRE ATT&CK Integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cristian Leo", email = "crisleoo@amazon.com"},
    {name = "Danny Cortegaca", email = "dicorteg@amazon.co.uk"},
    {name = "Anton Dykyi", email = "antondk@amazon.co.uk"},
]
maintainers = [
    {name = "Cristian Leo", email = "crisleoo@amazon.com"},
    {name = "Danny Cortegaca", email = "dicorteg@amazon.co.uk"},
    {name = "Anton Dykyi", email = "antondk@amazon.co.uk"},
]
keywords = [
    "threat-modeling",
    "security",
    "attack-trees",
    "mitre-attack",
    "ai",
    "aws-bedrock",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology", 
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]

# Only what the ML service (src/ml_service + its threatforest.* import closure)
# actually imports. The legacy pipeline's deps went with it: strands-agents and
# its 8 provider extras, strands-agents-tools, langfuse, click, questionary,
# boto3/botocore, aioboto3/aiobotocore/aiofiles, and stix2 (which had zero
# imports repo-wide even before the removal — STIX bundles are parsed with json).
# torch + transformers are kept explicit: they arrive via sentence-transformers
# and pinning them keeps the embedding runtime reproducible.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.12.0",
    "sentence-transformers>=5.1.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.0",
    "rich>=14.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # fastapi.testclient (src/ml_service/tests/test_parity.py) needs httpx.
    "httpx>=0.28.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/aws-samples/sample-agentic-attack-tree-generator"
Documentation = "https://aws-samples.github.io/sample-agentic-attack-tree-generator"
Repository = "https://github.com/aws-samples/sample-agentic-attack-tree-generator"
Issues = "https://github.com/aws-samples/sample-agentic-attack-tree-generator/issues"
Changelog = "https://github.com/aws-samples/sample-agentic-attack-tree-generator/releases"

[project.scripts]
# The pipeline entry point is the TypeScript CLI (`ts/packages/cli`). The only
# Python that ships is the embeddings/TTP-matching service.
threatforest-ml = "ml_service.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["threatforest*", "ml_service*"]

[tool.setuptools.package-data]
# Only the STIX bundles remain — the ML service resolves them relative to the
# package (see threatforest/config.py), so they must be packaged.
threatforest = [
    "data/**/*.json",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["src/ml_service/tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["src/ml_service/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
