[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatforest-strands"
version = "0.1.0"
description = "Strands-based agentic AI implementation for automated attack tree generation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ThreatForest Team", email = "team@threatforest.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "aioboto3>=15.5.0",
    "aiobotocore>=2.25.0",
    "aiofiles>=25.1.0",
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    "click>=8.3.0",
    "httpx>=0.28.0",
    "numpy>=2.3.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",
    "questionary>=2.1.0",
    "rich>=14.2.0",
    "scikit-learn>=1.7.0",
    "sentence-transformers>=5.1.0",
    "stix2>=3.0.1",
    "strands-agents>=1.15.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
threatforest-strands = "threatforest.strands_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["threatforest*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
